name: Calidad de Vida 2.0 Demo

on:
  push:
    branches: [main, feat/full-showcase-capture]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Lógica y plantillas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: node --check app.js
      - name: Ejecutar pruebas
        run: npm test

  browser:
    name: Recorrido real en Chromium
    needs: unit
    # Playwright 1.56 aún no instala Chromium en ubuntu-26.04 (actual ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar navegador de pruebas
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Validar navegación, capturas, reinicio y CSP
        run: python qa/browser_e2e.py
